appId: com.logisticsstudio.app
productName: Logistics Studio
copyright: Copyright © 2026 Logistics Studio
directories:
  output: release
  buildResources: build
files:
  - dist/**
  - package.json
win:
  target:
    - nsis
    - portable
nsis:
  # artifactName lives here, not under win: — a win-level artifactName would
  # make the NSIS installer and the portable .exe write the same filename
  # into release/ and overwrite each other.
  artifactName: ${productName}-${version}-setup.${ext}
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Logistics Studio
  uninstallDisplayName: Logistics Studio
  # User data lives in %APPDATA%\Logistics Studio (app.getPath('userData')),
  # outside the install dir — uninstalling must never delete the database.
  deleteAppDataOnUninstall: false
linux:
  target:
    - AppImage
  category: Office
